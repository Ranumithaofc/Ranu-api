<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranumitha-AI | Official API</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: white; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full glass p-8 rounded-3xl shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">Ranumitha-AI</h1>
            <p class="text-gray-400 mt-2">Personal AI Assistant API Dashboard</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Ask Something</label>
                <input type="text" id="userInput" placeholder="Type your message..." 
                    class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
            </div>

            <button onclick="askAI()" id="btn" class="w-full py-3 bg-blue-600 hover:bg-blue-700 rounded-xl font-semibold transition-all">
                Send Request
            </button>

            <div id="responseBox" class="hidden mt-6 p-4 rounded-xl bg-slate-900 border border-slate-800">
                <p class="text-xs text-blue-400 font-bold uppercase mb-2">AI Response:</p>
                <p id="aiReply" class="text-gray-300 text-sm leading-relaxed"></p>
            </div>
        </div>
        
        <p class="text-center text-[10px] text-gray-600 mt-8">© 2026 Developed by Hiruka Ranumitha</p>
    </div>

    <script>
        async function askAI() {
            const input = document.getElementById('userInput').value;
            const replyBox = document.getElementById('responseBox');
            const replyText = document.getElementById('aiReply');
            const btn = document.getElementById('btn');

            if (!input) return alert("Please enter a message!");

            btn.innerText = "Processing...";
            btn.disabled = true;

            try {
                const response = await fetch('/api', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: input })
                });
                const data = await response.json();
                
                replyBox.classList.remove('hidden');
                replyText.innerText = data.reply || "Error: No response from AI.";
            } catch (error) {
                alert("Something went wrong!");
            } finally {
                btn.innerText = "Send Request";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
